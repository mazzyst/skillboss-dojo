name: CI

# This repository ships content, not code — so the gate checks the promises the
# content makes rather than a build. Two of them are load-bearing:
#
#   · CONTRIBUTING.md tells contributors a human will review their kata against
#     the format. The counting part of that review is mechanical, and a machine
#     does it without getting bored — so the human reviewer spends their
#     attention on the ambiguity bar, which is the part no script can judge.
#   · docs/review/ sells a confidentiality posture. A page that quietly fetched
#     a font would hand every visitor's IP to a third party and contradict its
#     own argument. That check runs on every change, not on the day someone
#     remembers to look.
#
# No dependency to install: Python 3 is already on the runner, and the checker
# is standard library only, so a contributor can run the identical command
# locally before opening a pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a commit SHA, not a tag. A tag is a movable pointer: whoever
      # controls the action can repoint v7 at different code, and every workflow
      # trusting that tag runs it on the next push. A SHA cannot be repointed.
      # It matters more here than in a private repo — this workflow file is
      # public, so it doubles as a map of what an attacker would target.
      #
      # To refresh by hand — this is exactly how the value below was obtained:
      #   git ls-remote --tags https://github.com/actions/checkout | grep 'refs/tags/v7$'
      # If that tag also has a `^{}` twin, it is annotated and the `^{}` SHA is
      # the commit — use that one. v7 is lightweight, so its SHA is already the
      # commit. Dependabot bumps SHA pins too and rewrites the trailing comment,
      # so this stays current without hand-editing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Kata format, relative links, review page
        run: python3 .github/scripts/check-content.py

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SHA-pinned — see the note in the job above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gitleaks (pinned, checksum-verified official release)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          # Keep the ORIGINAL asset filename: the official checksums.txt lists
          # `<sha256>  gitleaks_<ver>_linux_x64.tar.gz`, and `sha256sum -c` opens
          # the file by that exact name.
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$asset"      "${base}/${asset}"
          curl -fsSL --retry 3 -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${asset}\$" checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          ./gitleaks version
      - name: Scan the working tree for secrets
        # --config .gitleaks.toml: one kata teaches "move the key out of the
        # code" and therefore has to SHOW a hardcoded key. That one placeholder
        # is allowlisted BY VALUE, so a real key landing in the same file is
        # still caught. Never allowlist the file — that would blind the scanner
        # to the very place a real secret is most likely to be pasted.
        run: |
          "$RUNNER_TEMP/gitleaks" dir . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            --verbose
