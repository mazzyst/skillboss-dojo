# Secret scan — blocks committed credentials on every push and PR.
# From the Ship-Ready Starter Pack (SECRETS system, THE LEAK).
#
# Hardening tip: pin the action below to a full commit SHA instead of
# the version tag, and review the pinned code once. A tag can move;
# a SHA cannot.
name: secret-scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — a secret hides in old commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
